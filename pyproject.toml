[project]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=2.0",
  "scipy>=1.13",
  "sympy>=1.12",
]
description = "A gallery of numerical experiments: conjectures, counterexamples, and code."
version = "1.6.0"
name = "mathxlab"
readme = "README.md"
requires-python = ">=3.14"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "hypothesis>=6.0",
  "ipython",
  "mypy>=1.10",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.6",
  "pytest>=8.0",
  "ruff>=0.6.0",
]

docs = [
  "furo>=2025.12.19",
  "myst-parser>=4.0.1",
  "sphinx-design>=0.6.1",
  "sphinx>=8.2.3",
  "sphinxcontrib-bibtex>=2.6.5",
]

[build-system]
requires = [
  "setuptools>=69",
]
build-backend = "setuptools.build_meta"

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

[tool.coverage.run]
branch = true
source = ["mathxlab"]
omit = [
  # Experiment scripts are treated as runnable notebooks / binaries and are
  # not part of the library coverage KPI.
  "mathxlab/experiments/*",
  "mathxlab/tools/*",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true

# Third-party libraries may ship incomplete typing information.
# Keep strict mode, but silence missing type information from external deps.
ignore_missing_imports = true
follow_imports = "silent"

# Restrict what mypy checks (fast, predictability).
files = [
  ".",
]
exclude = [
  ".venv",
  "build",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: slow tests (run separately, may take minutes)",
  "property: property-based tests (Hypothesis)",
]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
  "out",
  "templates",
]

[tool.ruff.format]
# Ruff format is Black-compatible by default.
# Keep defaults unless you have a strong reason to change them.

[tool.ruff.lint]
# A solid, modern baseline: pycodestyle/pyflakes + import sorting + common bugbear rules + upgrades.
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "RUF",
  "SIM",
  "UP",
  "W",
]
# Ruff's formatter handles code layout; ignore line-length violations (especially in docstrings/comments).
ignore = ["E501"]
allowed-confusables = ["α", "σ", "ℤ", "×", "−", "π", "ψ", "χ", "ζ", "≤", "≥", "λ", "φ", "–"]

[tool.ruff.lint.isort]
known-first-party = ["mathxlab", "experiments"]

[tool.setuptools]
packages = ["mathxlab", "experiments"]
